[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vfbquery-client"
version = "0.1.0.dev0"
description = "Lightweight HTTP client for the Virtual Fly Brain query API (v3-cached). Pure requests + pandas — no navis, installs in seconds."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Virtual Fly Brain" }]
dependencies = [
    "requests>=2.25",
    "pandas>=1.2",
]

[project.urls]
Homepage = "https://virtualflybrain.org"
# The client has no docs site of its own — it is documented alongside the
# service it calls, because most of what a caller needs to know (which endpoints
# exist, what `warnings` in a payload means, how `/combine` expressions are
# written) is service behaviour the client only passes through. Deep-linked to
# the client page rather than the site root so a PyPI visitor lands on the
# section about the thing they installed.
Documentation = "https://vfbquery.readthedocs.io/en/stable/python-client.html"
Source = "https://github.com/VirtualFlyBrain/VFBquery"
Issues = "https://github.com/VirtualFlyBrain/VFBquery/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# So `pytest` works in a fresh checkout without an editable install first —
# otherwise collection dies on ModuleNotFoundError and reads like a broken test
# suite rather than a missing `pip install -e .`.
pythonpath = ["src"]

# Documentation build gate.
#
# PARKED: move to `.github/workflows/docs.yml` to activate —
#     git mv docs/ci/docs.yml .github/workflows/docs.yml
# It lives here because the credential used to push this branch has no
# `workflow` scope, so a push touching `.github/workflows/` is rejected
# wholesale. See docs/ci/README.md.
#
# Read the Docs already builds the site on every commit, so what does this add?
# Timing and blast radius. RTD builds *after* the merge and reports on its own
# dashboard; this builds on the pull request, with `-W` so a warning fails, and
# puts the failure where the change is being reviewed. `.readthedocs.yaml` sets
# `fail_on_warning: true` for the same reason — the two agree on purpose, and if
# one is ever relaxed the other should be too, or the site and the gate start
# disagreeing about what "green" means.
#
# The link check is a separate, scheduled job rather than part of the gate: it
# hits the network, so a third-party site being down would fail an unrelated
# pull request. Weekly is enough to notice rot, and Monday morning is when
# somebody is around to fix it.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'clients/vfbquery-client/src/**'
      - 'src/vfbquery/combine.py'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'clients/vfbquery-client/src/**'
      - 'src/vfbquery/combine.py'
  schedule:
    # Monday 04:00 UTC — an hour after the search live gate, so the two do not
    # contend for the same runners.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          # The client is installed for real so autodoc reads the true
          # signatures; it is requests + pandas, so this is seconds. The server
          # package deliberately is NOT installed — `vfbquery.combine` is
          # stdlib-only and docs/conf.py reaches it via `src/` with the heavy
          # siblings mocked. If this line ever becomes necessary, something has
          # moved to the wrong side of that split.
          pip install ./clients/vfbquery-client

      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload the built site
        # Useful on a failing run too: you can download the partial build and
        # look at the page rather than reconstructing it from the log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

  linkcheck:
    name: Link check
    # Schedule and manual only — see the header. A dead third-party link is
    # worth knowing about; it is not worth failing somebody's pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install ./clients/vfbquery-client

      - name: Check links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      - name: Upload the link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-linkcheck
          path: docs/_build/linkcheck/output.txt
          retention-days: 30
